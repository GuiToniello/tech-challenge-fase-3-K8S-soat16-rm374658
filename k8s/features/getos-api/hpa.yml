apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: getos-api
  namespace: oficina
  labels:
    app.kubernetes.io/name: getos-api
    app.kubernetes.io/part-of: techchallenge-oficina
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: getos-api
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 30
    # Memória em 150% do request (192Mi): com o tracer .NET do Datadog, o uso em repouso passa dos 80% (~102Mi) e o HPA escalaria sem carga
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 150
