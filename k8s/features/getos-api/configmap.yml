apiVersion: v1
kind: ConfigMap
metadata:
  name: getos-api-config
  namespace: oficina
  labels:
    app.kubernetes.io/name: getos-api
    app.kubernetes.io/part-of: techchallenge-oficina
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"
  AllowedHosts: "*"
  Serilog__MinimumLevel__Default: "Information"
  Serilog__MinimumLevel__Override__Microsoft.AspNetCore: "Warning"
