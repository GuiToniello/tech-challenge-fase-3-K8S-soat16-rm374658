name: "[Reusable] Terraform"

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Pasta do Terraform (infra/foundation ou infra/addons, que também gerencia o Datadog)"
        required: true
        type: string
      command:
        description: "Comando do Terraform (validate, plan, apply ou destroy)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    concurrency:
      # Fora da main, apply/destroy usam um grupo próprio: falham no bloqueio abaixo sem cancelar um job legítimo pendente
      group: ${{ (inputs.command == 'apply' || inputs.command == 'destroy') && (github.ref == 'refs/heads/main' && format('terraform-{0}', inputs.working-directory) || format('terraform-blocked-{0}', github.run_id)) || format('terraform-{0}-{1}-{2}', inputs.working-directory, inputs.command, github.ref) }}
      cancel-in-progress: ${{ inputs.command == 'validate' || inputs.command == 'plan' }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      # apply/destroy só a partir da main, mesmo quando disparados manualmente em outra branch
      - name: Bloquear apply/destroy fora da main
        if: (inputs.command == 'apply' || inputs.command == 'destroy') && github.ref != 'refs/heads/main'
        env:
          COMMAND: ${{ inputs.command }}
        run: |
          echo "::error::$COMMAND só pode rodar a partir da branch main (ref atual: $GITHUB_REF)"
          exit 1
        working-directory: .

      # Só no addons: o provider e o Agent do Datadog precisam das chaves e do site, exceto com DD_ENABLED=false
      - name: Conferir secrets e variables do Datadog
        if: inputs.working-directory == 'infra/addons' && inputs.command != 'validate'
        env:
          DD_ENABLED: ${{ vars.DD_ENABLED || 'true' }}
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
          DD_SITE: ${{ vars.DD_SITE }}
        run: |
          if [ "$DD_ENABLED" = "false" ]; then
            echo "::notice::DD_ENABLED=false: Datadog desligado (o Terraform remove ou não cria o Agent e os recursos do Datadog). Para apagar recursos do Datadog que já existem, DD_API_KEY, DD_APP_KEY e DD_SITE precisam continuar válidos."
            exit 0
          fi
          missing=0
          for name in DD_API_KEY DD_APP_KEY DD_SITE; do
            if [ -z "${!name}" ]; then
              echo "::error::$name não configurado (Settings → Secrets and variables → Actions). Sem Datadog, defina a variable DD_ENABLED=false."
              missing=1
            fi
          done
          exit $missing
        working-directory: .

      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        if: inputs.command != 'validate'
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -input=false ${{ inputs.command == 'validate' && '-backend=false' || '' }}

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      # Plan especulativo (PR): não grava state, então roda sem lock
      - name: Terraform Plan
        if: inputs.command == 'plan'
        env:
          TF_VAR_datadog_enabled: ${{ vars.DD_ENABLED || 'true' }}
          TF_VAR_datadog_api_key: ${{ secrets.DD_API_KEY }}
          TF_VAR_datadog_app_key: ${{ secrets.DD_APP_KEY }}
          TF_VAR_datadog_site: ${{ vars.DD_SITE || 'datadoghq.com' }}  # padrão do variables.tf: vazio, o provider apontaria para https://api./
          TF_VAR_datadog_alert_recipients: ${{ secrets.DD_ALERT_RECIPIENTS }}  # secret: o repo é público e o plan imprime as mensagens
          TF_VAR_datadog_synthetics_status: ${{ vars.DD_SYNTHETICS_STATUS || 'live' }}
        run: terraform plan -input=false -lock=false

      - name: Terraform ${{ inputs.command }}
        if: inputs.command == 'apply' || inputs.command == 'destroy'
        env:
          TF_VAR_datadog_enabled: ${{ vars.DD_ENABLED || 'true' }}
          TF_VAR_datadog_api_key: ${{ secrets.DD_API_KEY }}
          TF_VAR_datadog_app_key: ${{ secrets.DD_APP_KEY }}
          TF_VAR_datadog_site: ${{ vars.DD_SITE || 'datadoghq.com' }}  # padrão do variables.tf: vazio, o provider apontaria para https://api./
          TF_VAR_datadog_alert_recipients: ${{ secrets.DD_ALERT_RECIPIENTS }}  # secret: o repo é público e o plan imprime as mensagens
          TF_VAR_datadog_synthetics_status: ${{ vars.DD_SYNTHETICS_STATUS || 'live' }}
        run: terraform ${{ inputs.command }} -auto-approve -input=false
